# dsh-maestro-notifier bundle patch — single row publishing the maestroNotifier service.
# The maestroNotifier service plus the telegram settings RPC on this package's own channel.
- insert:
    - id: maestro-notifier
      name: '@ddtcorex/dsh-maestro-notifier'
      # The channel this row always reserved, now actually served: the telegram
      # settings endpoints review used to host for it.
      channel: /dsh-maestro-notifier
      # rpc.handle registers a webServer route inside an effect fiber that
      # carries only the row's inject, not the module's; without webServer the
      # row fails on a harness that provides webServer after rows apply
      # (DSH 0.1.5-rc.1+); on DSH 0.2.x it is not sufficient on its own, see
      # the `connection` entry at the end of this file.
      inject: ['connection', 'webServer']

# DSH 0.2.x resolves `webServer` for `ctx.connection.rpc.handle` on the
# `connection` row own fiber, so a row-level inject cannot reach it. `inject`
# replaces the base list, hence `webStartup` (the base row needs it for
# trustedHosts) is repeated. Identical in every maestro package that registers
# RPC channels, so each one stays installable alone.
- id: connection
  inject:
    - webStartup
    - webServer
